server:
  port: 8080

spring:
  application:
    name: agentic-orchestrator-service

  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:agentic_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

agentic:
  model:
    provider: gemini
    api-key: ${GEMINI_API_KEY:}
    model-name: ${GEMINI_MODEL_NAME:gemini-3.5-flash}
    fallback-model-name: ${GEMINI_FALLBACK_MODEL_NAME:gemini-2.5-flash}
  workflow:
    max-review-loops: 3
    min-test-coverage: 70
  notification:
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}

logging:
  level:
    root: INFO
    com.agentic.platform: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.SseEmitter: WARN

